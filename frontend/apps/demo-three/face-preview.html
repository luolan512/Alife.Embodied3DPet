<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 对话与持续表情</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff2f8;color:#253044;font:14px system-ui}main{display:grid;grid-template-columns:minmax(0,1fr) 390px;height:100dvh;overflow:hidden}#viewport{min-width:0;min-height:0}aside{padding:18px;background:#fff;overflow:auto;min-width:0}h1{font-size:21px;margin:0 0 8px}p,small{line-height:1.6;color:#5a6578}textarea,select,button,input{font:inherit}textarea{width:100%;min-height:60px;padding:9px;border:1px solid #ccd3de;border-radius:8px;resize:vertical}select,button{padding:8px;margin:4px 0;border:1px solid #c7cfda;border-radius:7px;background:white;max-width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#455cc9;color:#fff;border:0}label{display:block;margin:12px 0}input[type=range]{max-width:48%;vertical-align:middle}input[type=number]{width:70px}pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}#status,#connection{padding:8px;background:#edf0fb;border-radius:7px;margin:8px 0}#messages{max-height:190px;overflow:auto;border:1px solid #e1e5ee;border-radius:8px;padding:8px;margin:8px 0}.message{white-space:pre-wrap;overflow-wrap:anywhere;padding:7px;border-radius:6px;margin-bottom:5px;background:#f2f4f8}.message.user{background:#e8eefc}.label{font-size:11px;font-weight:600;margin-right:6px}#error{color:#b32632;white-space:pre-wrap}summary{cursor:pointer;padding:10px 0}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.muted{font-size:12px;color:#667085}#affect-status{font-variant-numeric:tabular-nums;font-size:12px;line-height:1.7}canvas{display:block}@media(max-width:700px){main{display:flex;flex-direction:column}#viewport{flex:0 0 44dvh;height:44dvh}aside{padding:12px;min-height:0;flex:1}}
</style></head><body><main><div id="viewport"></div><aside>
<h1>AI 对话与持续表情</h1><p>中文交流，表情持续保持、衰减并续生成。说完后按 AI 计划执行动作。</p>
<div class="row"><select id="model" aria-label="角色"></select><button id="face-view">脸部</button><button id="full-view">全身</button><button id="takeover">接管动作</button></div>
<div id="connection">连接中…</div><div id="status">等待角色加载</div><div id="affect-status"></div><div id="error" role="alert"></div>
<div id="messages" aria-live="polite"><span class="muted">发送一句话开始验证。使用当前已配置的 AI 接口。</span></div>
<form id="chat-form"><textarea id="chat-input" aria-label="对角色说" placeholder="例如：见到你很开心！说完后点点头，再放松等我。" maxlength="4000"></textarea><div class="row"><button class="primary" id="send" disabled>发送给 AI</button><button id="stop" type="button">停止动作与续段</button></div></form>
<details><summary>单独测试表情／中文输入</summary>
<label>表演文字（中文或英文）<textarea id="text" maxlength="1000">你好，见到你很开心！</textarea></label>
<div class="row"><select id="examples" aria-label="表演示例"><option value="">选择示例</option><option value="happy">开心</option><option value="angry">生气</option><option value="sad">失落</option><option value="surprised">惊讶</option></select><select id="emotion" aria-label="目标情绪"><option value="happy">开心</option><option value="angry">生气</option><option value="sad">难过</option><option value="neutral">中性</option><option value="relaxed">放松</option></select></div>
<label><input type="checkbox" id="speaking" checked> 模拟无声说话（8秒）</label><button id="generate" class="primary" disabled>生成并表演</button> <button id="reset">渐回中性</button><p id="translation" class="muted">中文测试使用当前 AI 接口转换；英文直接进入本地模型。</p>
</details>
<details><summary>持续情绪与播放控制</summary>
<label><input type="checkbox" id="enabled" checked> 启用动态表情</label><label><input type="checkbox" id="continuous" checked> 自动续生成（约5秒一段）</label><label><input type="checkbox" id="guidance" checked> 启用情绪参数控制</label>
<label>表情强度 <input id="gain" type="range" min="0" max="1.5" step="0.05" value="1"> <span id="gain-value">1.00</span></label>
<label>播放速度 <input id="speed" type="range" min="0.5" max="3" step="0.1" value="1.5"> <span id="speed-value">1.5×</span></label>
<label>嘴型节奏 <input id="speech-rate" type="range" min="1" max="6" step="0.1" value="3.8"> <span id="speech-rate-value">3.8次/秒</span></label>
<p class="muted">情绪参数控制眉眼和嘴角，CTEG 叠加局部变化。关闭参数控制可对比原始模型。嘴型为程序模拟，未对齐真实音素。</p>
<label>愉悦度 <input id="valence" type="range" min="-1" max="1" step="0.05" value="0"> <span id="valence-value">0.00</span></label>
<label>激动度 <input id="arousal" type="range" min="-1" max="1" step="0.05" value="0"> <span id="arousal-value">0.00</span></label>
<label>强势度 <input id="dominance" type="range" min="-1" max="1" step="0.05" value="0"> <span id="dominance-value">0.00</span></label>
<label>情绪强度 <input id="intensity" type="range" min="0" max="1" step="0.05" value="0.8"> <span id="intensity-value">0.80</span></label>
<label>保持 <input id="hold-s" type="number" min="0" max="120" value="8"> 秒　衰减 <input id="decay-s" type="number" min="2" max="300" value="45"> 秒</label>
<button id="apply-state">应用持续情绪</button><label>复合情绪 <select id="mix-first" aria-label="第一种情绪"><option value="happy">开心</option><option value="sad">难过</option><option value="angry">生气</option><option value="relaxed">放松</option></select> ＋ <select id="mix-second" aria-label="第二种情绪"><option value="sad">难过</option><option value="happy">开心</option><option value="angry">生气</option><option value="relaxed">放松</option></select></label><label>第一种比例 <input id="mix-ratio" type="range" min="0" max="1" step="0.05" value="0.5"> <span id="mix-ratio-value">50%</span></label><button id="apply-mixture">应用复合情绪</button>
</details>
<details><summary>AI 接口设置</summary><label>Base URL<input id="base-url" style="width:100%" placeholder="当前接口地址"></label><label>模型<input id="ai-model" style="width:100%"></label><label>API Key（留空保留现有密钥）<input id="api-key" type="password" autocomplete="off" style="width:100%"></label><button id="save-config">保存接口</button><p class="muted">聊天与中文转换使用此接口；CTEG 表情生成和 ARDY 动作在本机运行。</p></details>
<details><summary>运行状态与映射</summary><pre id="debug"></pre></details>
</aside></main><script type="module" src="/src/face-preview.ts"></script></body></html>
